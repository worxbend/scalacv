name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Mill 1.1.7 ignores JAVA_HOME and MILL_JVM_VERSION when it runs modules, and the
# //| mill-jvm-version: header in build.mill would otherwise freeze every rung of the
# matrix to one JDK. MILL_JVM_ID is read by build.mill to override it per rung, so
# actions/setup-java is deliberately absent from the JDK matrix below — it cannot
# steer Mill.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.jdk }} · ubuntu
    runs-on: ubuntu-latest
    # Every job is bounded: a hung native call (capture.read cannot be interrupted) would otherwise
    # pin a runner for GitHub's 6-hour default.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        jdk: ["17", "21", "25"]
    env:
      MILL_JVM_ID: zulu:${{ matrix.jdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      - name: Compile
        # Explicit module list, not __: examples-gui pulls a per-host OpenJFX and must never be
        # built in CI. __ would drag it in. vision and graphs are named explicitly rather than left
        # to examples to pull in transitively -- a refactor that drops the examples->vision/graphs
        # edge must not silently stop compiling two published modules.
        run: ./mill core.compile vision.compile graphs.compile zio.compile examples.compile

      - name: Assert the build really ran on JDK ${{ matrix.jdk }}
        # Without this the matrix is decorative: if the jvmId override ever stops being
        # honoured, all three rungs silently run the same JDK and still go green.
        run: ./mill examples.runMain scalacv.jvmReport | tee /dev/stderr | grep -q "java.version=${{ matrix.jdk }}"

      - name: Test
        # `+`-separated, not space-separated: `test` is a Mill *command*, so in
        # `./mill core.test zio.test examples.test` the later targets are passed to core.test as munit
        # test-name filters (matching nothing) and zio/examples never run at all -- green in 2 s.
        # vision/graphs run their owning suites; core keeps the integration/property/API/POM gates.
        # ScalacvTests rejects empty suite discovery instead of silently passing an unwired module.
        run: ./mill core.test + vision.test + graphs.test + zio.test + examples.test

      - name: Docs snippets still compile
        # The docs are a gate, not a courtesy: a code change that breaks an example fails here.
        run: ./mill docs.mdocCheck

      - name: Smoke — natives load with no GUI toolkit present
        # ubuntu-latest has no libgtk-x11-2.0. That is the point: this must pass anyway.
        # The success signal is the OK line, not the exit code: OpenCV/OpenBLAS native teardown
        # at JVM shutdown occasionally exits non-zero after a fully successful run. Capture then
        # grep -- a pipe would let mill's exit code fail the step under bash's pipefail even when
        # OK is present. A genuine load failure prints no OK, so this still fails loudly.
        run: |
          out=$(./mill examples.runMain scalacv.smoke 2>&1) || true
          echo "$out"
          echo "$out" | grep -q '^OK'

  leak-check:
    name: Native leak — RSS stays flat under load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The one gate the test suite cannot be: an unreleased Mat frees its native buffer only when
    # finalize eventually runs, so a leak shows up as *resident-memory growth*, not a failing
    # assertion -- a green test run with a steadily climbing RSS. This is the leg that would have
    # caught the H1/M3/L2/L3 leaks. It drives the high-level read->gray->canny->bytes pipeline 2000×
    # in a single long-lived JVM and asserts RSS does not climb once the natives are warm. A
    # per-iteration leak of a 240×240×3 Mat is ~170 KB, so ~1800 measured iterations would grow RSS
    # by ~300 MB -- far past the ceiling below -- while a leak-free run stays flat.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        # Unlike the build matrix (where setup-java is deliberately absent because it cannot steer
        # Mill's module JVM), this leg needs a plain java/javac on PATH for the stress driver below.
        # Mill still selects its own JVM via the build header; this only provides the JDK that runs
        # the driver, so the two do not conflict.
        with:
          distribution: temurin
          java-version: "25"

      - name: Leak regression suite (RSS-gated, finding-specific paths)
        # The leaks module runs in its own forked JVM as a single suite, so process RSS is not
        # contaminated by concurrent suites. It gates the finding-specific paths (background-effect
        # error path, Intrinsics-per-call) that the single-pipeline driver below does not exercise.
        # RSS -- not Pointer.totalBytes() -- is the only signal that sees org.opencv.core.Mat buffers.
        run: ./mill leaks.test

      - name: Stress native allocation and assert RSS stays bounded
        run: |
          set -euo pipefail
          # The examples run classpath carries scalacv (core/vision/graphs), the synthetic Fixtures
          # scenes and the natives jars -- exactly what the driver links. Strip Mill's ref: prefix
          # down to the absolute path, then join the entries into one classpath.
          CP=$(./mill show examples.runClasspath | jq -r '.[]' | grep -oE '/.*' | paste -sd: -)

          # A minimal external driver (plain Java, like ci/consumer-smoke): loop the high-level
          # pipeline in one JVM so an unreleased Mat accumulates, and read VmRSS from /proc after a
          # warm-up baseline and again at the end. It gates on the *delta*, not an absolute footprint,
          # so the large, platform-dependent OpenCV/OpenBLAS load cost is already in the baseline and
          # only genuine growth trips it. No image asset ships, so Fixtures.shapes draws the input.
          cat > LeakStress.java <<'EOF'
          public class LeakStress {
            static long rssKb() throws Exception {
              for (String l : java.nio.file.Files.readAllLines(java.nio.file.Path.of("/proc/self/status")))
                if (l.startsWith("VmRSS:")) return Long.parseLong(l.replaceAll("[^0-9]", ""));
              throw new RuntimeException("VmRSS not found in /proc/self/status");
            }
            static void iter() {
              scalacv.Image img = scalacv.Image$.MODULE$.wrap(scalacv.Fixtures$.MODULE$.shapes(240));
              scala.util.Either<?, ?> r = img.gray().blur(1).canny(60.0, 160.0, 3, false).bytes(".png");
              if (r.isLeft()) throw new RuntimeException("pipeline failed: " + r);
            }
            public static void main(String[] args) throws Exception {
              scalacv.OpenCv$.MODULE$.load();
              int warmup = 200, total = 2000;
              for (int i = 0; i < warmup; i++) iter();
              System.gc(); Thread.sleep(200);
              long baseline = rssKb();
              for (int i = warmup; i < total; i++) iter();
              System.gc(); Thread.sleep(200);
              long end = rssKb();
              System.out.println("RSS-BASELINE-KB=" + baseline);
              System.out.println("RSS-FINAL-KB=" + end);
              System.out.println("RSS-GROWTH-KB=" + (end - baseline));
              System.out.println("LEAK-OK");
            }
          }
          EOF
          javac -cp "$CP" -d . LeakStress.java

          # -Xmx256m: an on-heap leak (a retained Image or byte[]) OOMs and fails here too; a *native*
          # Mat leak instead escapes the heap and grows RSS, which the delta check below catches --
          # that native path is the one the H1/M3/L2/L3 leaks took. Gate on the LEAK-OK line, not the
          # exit code: OpenCV/OpenBLAS native teardown at JVM shutdown occasionally exits non-zero
          # after a fully successful run (same as the smoke jobs).
          out=$(java -Xmx256m -cp ".:$CP" LeakStress 2>&1) || true
          echo "$out"
          echo "$out" | grep -q '^LEAK-OK'
          growth=$(echo "$out" | sed -n 's/^RSS-GROWTH-KB=//p')
          ceiling=204800   # 200 MB: far below a real leak's ~300 MB, far above steady-state jitter
          echo "RSS grew ${growth:-<none>} KB across the measured run (ceiling ${ceiling} KB)"
          test -n "$growth"
          test "$growth" -le "$ceiling"

  style:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - name: scalafmt
        run: ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll
      - name: scalafix
        # Every publishable module (core, vision, graphs, zio) plus examples. Scoped like the build
        # job: examples-gui stays out of CI. vision and graphs are named explicitly here rather than
        # left unlinted -- they are published surface, so they get the same --check as the rest.
        # `+`-separated, for the same reason as the Test step: without it, `vision.fix` and the rest
        # are passed to `core.fix` as arguments and only core is ever linted.
        run: ./mill core.fix --check + vision.fix --check + graphs.fix --check + zio.fix --check + examples.fix --check

  natives:
    name: Natives · macos-26 arm64
    runs-on: macos-26
    timeout-minutes: 60
    # macOS only. The headless loader is verified on linux-x86_64 by the build job; this leg
    # verifies the @rpath-resolved macOS path. Windows is deliberately absent: the `./mill`
    # bootstrap is a Unix-only launcher (it prints "supports only Linux and macOS" and exits),
    # and Mill 1.1.7 ships no Windows launcher, so a windows-latest leg would fail at the
    # launcher without exercising anything. The Windows loader path (a bulk-load fallback,
    # since the linker error names no library) is implemented but can only be verified on a
    # Windows host is not exercised here. Adding the leg back is a one-line change once a
    # working Windows Mill invocation exists.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - name: Smoke
        # Same as the ubuntu smoke: gate on the OK line, not mill's teardown-sensitive exit code.
        run: |
          out=$(./mill examples.runMain scalacv.smoke 2>&1) || true
          echo "$out"
          echo "$out" | grep -q '^OK'

      - name: Test on arm64
        # The full suite runs only on ubuntu-x86_64 in the build matrix. This extends the same
        # assertions to Apple-silicon arm64, where an arch-specific bug — a wrong native classifier,
        # an endianness or alignment assumption — would otherwise ship unseen. Mill's default JDK
        # (the build header) is enough; the point is the architecture, not another JDK rung.
        # `+`-separated for the same reason as the build matrix's Test step. examples.test is
        # included so the QR/ArUco/Haar/Canny end-to-end assertions also run on arm64.
        run: ./mill core.test + vision.test + graphs.test + zio.test + examples.test

  publish-shape:
    name: Published artifact shape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8

      - name: Only core, graphs, vision and zio may publish
        # examples and examples-gui must never reach Central; examples-gui's OpenJFX
        # resolves per-host and would be wrong for everyone who downloaded it.
        # Assert the exact *set* of publishable module names, not just a count: a fifth
        # publishable module must be a deliberate, failing-until-updated edit here rather
        # than something that silently ships (or a rename that a count would wave through).
        run: |
          got=$(./mill resolve "__:PublishModule.publishArtifacts" \
            | grep -E "^[a-z][a-zA-Z0-9-]*\.publishArtifacts$" \
            | sed -E 's/\.publishArtifacts$//' \
            | sort | paste -sd' ' -)
          want="core graphs vision zio"
          echo "publishable modules: $got"
          test "$got" = "$want"

      - name: POM dependency set
        # The failure this catches is invisible from inside the build: a classifier is
        # silently stripped from the POM, CI stays green because it compiles from source,
        # and every consumer resolves an artifact with no natives.
        run: ./mill core.test.testOnly scalacv.PublishedPomTest

      - name: publishLocal
        run: ./mill __.publishLocal

  consumer-smoke:
    name: Consumer resolves the published artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - uses: coursier/setup-action@3174df5c784a0c8724f06b7924b849551c40c39e # v3
        with:
          jvm: zulu:17

      - name: Publish all four modules to the local ivy repo
        run: ./mill __.publishLocal

      - name: A from-scratch consumer resolves all four artifacts on a clean cache and loads natives
        # The single highest-value publishing gate: each published POM carries only the classifier-less
        # opencv (Mill cannot emit a <classifier>), so a real consumer adds the two documented natives
        # coordinates. Listing all four published coordinates makes cs fetch resolve every one -- and its
        # full transitive set -- from a fresh COURSIER_CACHE, a true from-nothing resolve that would catch
        # the "green build, zero natives shipped" failure the old publishLocal-dry-run gate waved through.
        # The smoke program then links a symbol from core, vision and graphs (zio's public surface is a
        # package object whose holder class Java cannot name, so its resolution is exercised by cs fetch
        # alone). Gate on the CONSUMER-OK line, not the exit code: native teardown at JVM shutdown
        # occasionally exits non-zero after a fully successful run.
        run: |
          set -euo pipefail
          VER=$(./mill show core.publishVersion | tr -d '"')
          echo "resolving the four com.worxbend scalacv artifacts :$VER from a clean cache"
          export COURSIER_CACHE=$(mktemp -d)
          CP=$(cs fetch --classpath -r ivy2Local \
            "com.worxbend:scalacv_3:$VER" \
            "com.worxbend:scalacv-vision_3:$VER" \
            "com.worxbend:scalacv-graphs_3:$VER" \
            "com.worxbend:scalacv-zio_3:$VER" \
            "org.bytedeco:opencv:4.14.0-1.5.14,classifier=linux-x86_64" \
            "org.bytedeco:openblas:0.3.34-1.5.14,classifier=linux-x86_64")
          javac -cp "$CP" -d /tmp/consumer ci/consumer-smoke/ConsumerSmoke.java
          out=$(java -cp "/tmp/consumer:$CP" ConsumerSmoke 2>&1) || true
          echo "$out"
          echo "$out" | grep -q '^CONSUMER-OK'
