name: Release

on:
  push:
    tags: ["v*"]
  # Select a release tag when dispatching; branches are rejected before CI starts.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Require a release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$GITHUB_REF_TYPE" = tag

  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MILL_JVM_ID: zulu:25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout is the validated tag commit
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: |
          actual=$(git rev-parse HEAD)
          test -n "$VALIDATED_SHA"
          test "$actual" = "$VALIDATED_SHA"
          test "$actual" = "$GITHUB_SHA"
      - name: Publishing credentials are present
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
        run: |
          missing=""
          for variable in MILL_SONATYPE_USERNAME MILL_SONATYPE_PASSWORD MILL_PGP_SECRET_BASE64; do
            [ -n "${!variable}" ] || missing="$missing $variable"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing publishing credentials:$missing (see RELEASING.md)"
            exit 1
          fi
      - uses: coursier/cache-action@057d08c2f9a2c4e7a4d33df3aae657b7db88b8cc # v8
      - name: Tag, changelog and all four publish versions agree
        run: python3 ci/validate-release.py
      - name: Publish signed libraries to Maven Central
        timeout-minutes: 25
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
        run: >-
          ./mill mill.javalib.SonatypeCentralPublishModule/
          --publishArtifacts '{core,vision,graphs,zio}.publishArtifacts'
          --shouldRelease true --awaitTimeout 1200000
      - name: Verify all public Central release files
        timeout-minutes: 20
        run: python3 ci/verify-published.py https://repo.maven.apache.org/maven2
      - name: Attest the verified release jars
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            out/core/jar.dest/*.jar
            out/core/sourceJar.dest/*.jar
            out/core/docJar.dest/*.jar
            out/vision/jar.dest/*.jar
            out/vision/sourceJar.dest/*.jar
            out/vision/docJar.dest/*.jar
            out/graphs/jar.dest/*.jar
            out/graphs/sourceJar.dest/*.jar
            out/graphs/docJar.dest/*.jar
            out/zio/jar.dest/*.jar
            out/zio/sourceJar.dest/*.jar
            out/zio/docJar.dest/*.jar
      - uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3 # v3
        with:
          jvm: zulu:17
      - name: Java 17 and Scala 3.3.8 consumers resolve from Central
        timeout-minutes: 10
        run: bash ci/consumer-smoke/run.sh "${GITHUB_REF_NAME#v}" https://repo.maven.apache.org/maven2

  release:
    name: Announce verified Central release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.validated-sha }}
          persist-credentials: false
      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
