name: Docs

# Builds the Docusaurus site and deploys it to GitHub Pages. mdoc type-checks every Scala snippet
# first (via scripts/assemble-docs.sh), so a code change that breaks a doc example fails here rather
# than shipping a wrong example. mdoc runs on PRs (ci.yml's build matrix); the API-link check and the
# site build run on PRs in ci.yml's `docs-site` job, so drift is caught before merge, not only here.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MILL_JVM_ID: zulu:25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: coursier/cache-action@95e5b1029b6b86e7bac033ee44a0697d8a527d2d # v8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      # mdoc (type-checks + splices snippets) -> copy pages into website/docs; unified Scaladoc
      # (core+vision+graphs) + zio -> website/static/api; then verify every in-content /api/ link
      # resolves to a generated Scaladoc file. Same script as the local dev loop, so CI and local
      # builds cannot diverge.
      - name: Assemble docs (mdoc + Scaladoc + API-link check)
        run: ./scripts/assemble-docs.sh

      - name: Build the Docusaurus site
        working-directory: website
        run: |
          npm ci
          npm run build

      # ONE-TIME OWNER ACTION before the first deploy: Settings -> Pages -> Source: "GitHub Actions".
      # The default GITHUB_TOKEN cannot create the Pages site itself; everything above still runs.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
